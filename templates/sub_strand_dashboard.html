<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    NafuLearn - {{ grade }} - {{ sub_strand }}
</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='theme.css') }}"
>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='index.css') }}"
>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='dashboard.css') }}"
>

<script
    src="{{ url_for('static', filename='theme.js') }}"
></script>

</head>

<body>

<header class="site-header dashboard-header">

<div class="header-content">

    <a
        href="{{ url_for('home') }}"
        class="header-logo"
    >

        <img
            src="{{ url_for('static', filename='images/nafulearn-brand.png') }}"
            alt="NafuLearn"
        >

    </a>

    <nav class="main-navigation">

        <a
            href="{{ url_for('home') }}"
            class="nav-link"
        >
            Home
        </a>

        <a
            href="{{ url_for('dashboard') }}"
            class="nav-link"
        >
            Dashboard
        </a>

        <a
            href="{{ url_for('learn') }}"
            class="nav-link"
        >
            Learn
        </a>

        <a
            href="{{ url_for('ask') }}"
            class="nav-link"
        >
            Ask
        </a>

        <a
            href="{{ url_for('settings') }}"
            class="nav-link"
        >
            Settings
        </a>

    </nav>

</div>

</header>


<main class="dashboard-page">


<section class="dashboard-introduction">

    <p class="dashboard-label">
        {{ grade }} · {{ subject }}
    </p>

    <h1>
        {{ sub_strand }}
    </h1>

    <p>
        Choose a lesson to begin learning.
    </p>

</section>


<section class="grade-section">

    <div class="grade-grid">

        {% for lesson in lessons %}

        <a
            href="{{ url_for(
                'learn',
                lesson_id=lesson.lesson_id
            ) }}"
            class="grade-card"
        >

            <div class="grade-content">

                <h2>
                    {{ lesson.lesson }}
                </h2>

                <p>
                    Lesson {{ lesson.lesson_number or loop.index }}
                </p>

            </div>

            <div class="grade-arrow">
                →
            </div>

        </a>

        {% endfor %}

    </div>

</section>


</main>


<footer class="footer">

<p>
    © 2026 NafuLearn
</p>

</footer>

</body>

</html>
